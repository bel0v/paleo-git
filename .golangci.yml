version: "2"

linters:
  enable:
    - errcheck
    - gocritic
    - gosec
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unconvert
    - unused
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprintln
        - fmt.Fprintf
        - (*os.File).Close
    gosec:
      excludes:
        - G204 # subprocess launched with variable — expected for git/runner wrappers
        - G301 # directory permissions 0755 — standard for shared data dirs
        - G302 # file permissions 0644 — standard for data files
        - G304 # file inclusion via variable — expected for config/data file reading
        - G306 # WriteFile permissions 0644 — standard for data files

formatters:
  enable:
    - gofumpt
  settings:
    gofumpt:
      extra-rules: true
