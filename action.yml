name: Setup paleo-git
description: Install a paleo-git release binary and add it to PATH
author: bel0v
branding:
  icon: layers
  color: blue

inputs:
  version:
    description: >-
      Release to install, e.g. v0.4.0. Defaults to the ref this action was
      referenced with, so `uses: bel0v/paleo-git@v0.4.0` installs v0.4.0.
      Use `latest` for the newest release.
    required: false
    default: ""

outputs:
  version:
    description: The version that was installed, e.g. v0.4.0
    value: ${{ steps.install.outputs.version }}
  path:
    description: Directory containing the paleo-git binary
    value: ${{ steps.install.outputs.path }}

runs:
  using: composite
  steps:
    - id: install
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        ACTION_REF: ${{ github.action_ref }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        repo="bel0v/paleo-git"

        version="${INPUT_VERSION:-$ACTION_REF}"
        if [ "$version" = "latest" ]; then
          version=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$repo/releases/latest" \
            | sed -n 's/.*"tag_name": *"\([^"]*\)".*/\1/p')
        fi
        case "$version" in
          v[0-9]*) ;;
          *) echo "::error::paleo-git: '$version' is not a release tag. Reference the action with a tag (uses: $repo@v0.4.0), set 'version', or use 'latest'." >&2; exit 1 ;;
        esac

        case "$RUNNER_OS" in
          Linux) os=linux ;;
          macOS) os=darwin ;;
          *) echo "::error::paleo-git: unsupported runner OS '$RUNNER_OS' (Linux and macOS are supported)" >&2; exit 1 ;;
        esac
        case "$RUNNER_ARCH" in
          X64) arch=amd64 ;;
          ARM64) arch=arm64 ;;
          *) echo "::error::paleo-git: unsupported runner architecture '$RUNNER_ARCH'" >&2; exit 1 ;;
        esac

        dest="${RUNNER_TOOL_CACHE:-$RUNNER_TEMP}/paleo-git/$version/$arch"
        if [ ! -x "$dest/paleo-git" ]; then
          asset="paleo-git_${os}_${arch}.tar.gz"
          base="https://github.com/$repo/releases/download/$version"
          work=$(mktemp -d)
          curl -fsSL -o "$work/$asset" "$base/$asset"
          curl -fsSL -o "$work/checksums.txt" "$base/checksums.txt"
          (cd "$work" && grep " $asset\$" checksums.txt | shasum -a 256 -c - >/dev/null)
          mkdir -p "$dest"
          tar -xzf "$work/$asset" -C "$dest" paleo-git
          rm -rf "$work"
        fi

        echo "$dest" >> "$GITHUB_PATH"
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "path=$dest" >> "$GITHUB_OUTPUT"
        echo "paleo-git $version installed to $dest"
