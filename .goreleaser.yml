version: 2

builds:
  - main: ./cmd/paleo-git
    binary: paleo-git
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  groups:
    - title: "\U0001F4A5 Breaking Changes"
      regexp: '^.*?💥'
      order: 0
    - title: "\U0001F680 Features"
      regexp: '^.*?✨'
      order: 1
    - title: "\U0001F41B Bug Fixes"
      regexp: '^.*?🐛'
      order: 2
    - title: "\U0001F528 Improvements"
      regexp: '^.*?♻️'
      order: 3
    - title: "\U0001F5D1 Other"
      order: 999
  filters:
    exclude:
      - "^🧹"
      - "^🧪"
      - "^📝"

homebrew_casks:
  - name: paleo-git
    binaries:
      - paleo-git
    repository:
      owner: bel0v
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/bel0v/paleo-git
    description: Track code migration progress in git repositories
